[package]
name = "correlation_with_confidence"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py39"] }
numpy = "0.20"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
statrs = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
